<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로컬판 | 국방이음+ | 계획·실시 연계형 업무 점검 도구</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232457c5'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
/* 국방이음+ (계획·실시 연계형 업무 점검 도구) — 외부 폰트·CDN 없이 시스템 글꼴만 사용 */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --line: #e3e7ee;
  --line-2: #cdd4df;
  --text: #17202e;
  --text-2: #5a6577;
  --navy: #14294b;      --navy-2: #1d3a66;     --navy-text: #c9d4e6;
  --teal: #0d7672;      --teal-2: #0a615e;     --teal-soft: #e3f3f1;
  --accent: #0d7672;    --accent-soft: #e3f3f1;
  --done: #1d8a4a;      --done-bg: #e6f5ec;
  --doing: #7a3fd1;     --doing-bg: #f1eafd;
  --ns: #c46a00;        --ns-bg: #fff1df;
  --plan: #2563c9;      --plan-bg: #e8f0fd;
  --od: #d4342c;        --od-bg: #fdeceb;
  --log: #5a6577;       --log-bg: #eef0f4;
  --star: #b8860b;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(20, 30, 50, .05), 0 4px 14px rgba(20, 30, 50, .05);
  font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color: var(--text);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { font-size: 14px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
a { color: var(--teal); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; }
h2 { font-size: 18px; } h3 { font-size: 15px; margin-bottom: 8px; } h4 { font-size: 13.5px; margin: 10px 0 6px; }
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; background: #fff; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal-soft); border-color: var(--teal); }
textarea { resize: vertical; width: 100%; }
.ic { flex: none; display: inline-block; vertical-align: middle; }
.boot { padding: 60px; text-align: center; color: var(--text-2); }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
.red { color: var(--od); }
.grow { flex: 1; }
.nowrap { white-space: nowrap; }
.hint { color: var(--text-2); font-size: 12.5px; margin: 6px 0; }
.empty { color: var(--text-2); padding: 8px 4px; font-size: 13px; }

/* 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2);
  background: #fff; border-radius: 8px; padding: 7px 13px; cursor: pointer; white-space: nowrap; font-weight: 600;
}
.btn:hover { background: var(--surface-2); }
.btn.primary, .btn.teal { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover, .btn.teal:hover { background: var(--teal-2); }
.btn.teal .ic, .btn.primary .ic { color: #fff; }
.btn.outline { background: #fff; border-color: var(--line-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.ok { background: var(--done); border-color: var(--done); color: #fff; }
.btn.danger { color: var(--od); border-color: #efc2bf; }
.btn.danger:hover { background: var(--od-bg); }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn.tiny { padding: 1px 7px; font-size: 11.5px; border-radius: 6px; }
.btn.icon { padding: 6px; line-height: 1; }
.btn.icon.sq { width: 36px; height: 36px; }
.btn.block { flex: 1; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── 앱 틀: 왼쪽 메뉴 + 본문 ── */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow: auto; background: linear-gradient(180deg, var(--navy) 0%, #102240 100%);
  color: #fff; padding: 22px 12px 18px; display: flex; flex-direction: column; gap: 18px;
}
.side-brand { padding: 0 12px; }
.side-name { font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
.side-name span { color: #5fd3c9; }
.side-sub { font-size: 12.5px; color: var(--navy-text); margin-top: 6px; }
.side-nav { display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, .12); }
.nav {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; border-radius: 10px; background: transparent;
  color: #e7edf7; cursor: pointer; font-weight: 700; font-size: 15px; text-align: left;
}
.nav:hover { background: rgba(255, 255, 255, .07); }
.nav.on { background: #2563c9; box-shadow: inset 3px 0 0 #8fb8ff; }
.nav .ic { width: 20px; height: 20px; }
.nav-badge { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #e0473e; color: #fff; font-size: 12px; display: inline-grid; place-items: center; }
.side-sec { display: flex; flex-direction: column; gap: 4px; }
.side-sec-head { display: flex; justify-content: space-between; padding: 0 12px 6px; font-size: 13px; font-weight: 700; color: #fff; }
.muted-inv { color: var(--navy-text); font-weight: 600; }
.side-doc { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border: 0; background: none; color: #e7edf7; font-size: 13.5px; cursor: pointer; border-radius: 8px; text-align: left; }
.side-doc:hover { background: rgba(255, 255, 255, .07); }
.side-doc .ic { color: #2bb673; width: 20px; height: 20px; }
.side-doc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-empty { padding: 4px 12px; color: var(--navy-text); font-size: 12.5px; }
.side-add { margin: 10px 4px 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px; border: 1px solid rgba(255, 255, 255, .35); border-radius: 9px; background: transparent; color: #fff; font-weight: 700; cursor: pointer; }
.side-add:hover { background: rgba(255, 255, 255, .08); }

.shell-main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 24px; background: rgba(255, 255, 255, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
}
.top-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--text-2); font-weight: 600; }
.tchip b { color: var(--text); }
.tchip.teal { background: var(--teal-soft); border-color: #bfe3df; color: var(--teal-2); }
.tchip.teal b { color: var(--teal-2); font-size: 14px; }
.tchip.red { background: var(--od-bg); border-color: #f1b7b2; color: #a3241d; cursor: help; }
.tchip.green { background: var(--done-bg); border-color: #b9e2c9; color: var(--done); }
.tchip-x { border: 0; background: none; cursor: pointer; color: inherit; padding: 0 0 0 2px; font-size: 11px; opacity: .7; }
.tchip-x:hover { opacity: 1; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.who { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 3px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #e9edf3; display: grid; place-items: center; color: #2b3546; }
.who select { border: 0; font-weight: 700; padding: 4px 2px; background: transparent; max-width: 150px; }
.who select:focus { outline: none; }

.main { padding: 18px 24px 30px; width: 100%; max-width: 1640px; }
.hero { margin: 4px 0 16px; }
.hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -.8px; }
.hero p { margin: 6px 0 0; color: var(--text-2); font-size: 15px; }
.foot-note { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; margin-top: 18px; }
.page { display: flex; flex-direction: column; gap: 14px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.card, .box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.box.pad { padding: 14px 16px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sec-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.cnt, .pcard-cnt { display: inline-block; min-width: 22px; text-align: center; padding: 0 7px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--text-2); font-weight: 700; }

/* 요약 카드 (누락 점검·처리 결과) */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.cards.small { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin: 8px 0 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); border-left: 4px solid var(--teal); }
.stat.c-done { border-left-color: var(--done); }
.stat.c-open { border-left-color: var(--od); }
.stat-label { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.stat-num { font-size: 28px; font-weight: 800; line-height: 1.15; }
.stat-sub { font-size: 12px; color: var(--text-2); }

/* ── 업무 달력 ── */
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 16px; align-items: start; }
.cal-card { padding: 16px 16px 12px; }
/* 첫 화면: 이번 주 요일별 예정·실시 */
.home-card { padding: 16px 16px 12px; }
.home-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
.home-head .cal-title { margin-left: 2px; }
.week-days { display: flex; flex-direction: column; gap: 10px; }
.day { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.day.today { border: 2px solid var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.day.past { background: var(--surface-2); }
.day-head { display: flex; align-items: baseline; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 15px; }
.day-head span { color: var(--text-2); }
.day.sun .day-head b, .day.sun .day-head > span:nth-child(2) { color: var(--od); }
.day.sat .day-head b, .day.sat .day-head > span:nth-child(2) { color: var(--plan); }
.today-tag { margin-left: 6px; background: var(--teal); color: #fff !important; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.day-cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.day-col { padding: 4px 12px 8px; min-width: 0; }
.day-col + .day-col { border-left: 1px dashed var(--line); }
.col-label { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--text-2); margin: 4px 0 2px; }
.col-label .ic { width: 14px; height: 14px; }
.log-row { display: flex; gap: 8px; align-items: flex-start; padding: 7px 2px; border-bottom: 1px solid var(--line); }
.log-row[data-act] { cursor: pointer; }
.log-row:last-child, .day-col .ri:last-child { border-bottom: 0; }
.log-res { flex: none; font-size: 11.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px; background: var(--doing-bg); color: var(--doing); margin-top: 1px; }
.log-row.done .log-res { background: var(--done-bg); color: var(--done); }
.log-text { font-weight: 600; }
/* 지시사항 추적 대장 */
.o-sum { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; margin-bottom: 14px; }
.o-sum .sum { cursor: default; }
.o-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.o-tbl td { vertical-align: top; }
.o-title { font-weight: 700; cursor: pointer; min-width: 220px; }
.o-title:hover { color: var(--teal); text-decoration: underline; }
.o-action { min-width: 220px; max-width: 340px; }
.oa-text { white-space: normal; }
.o-btns .btn { margin: 0 2px 4px 0; }
.dd-badge { display: inline-block; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--log-bg); }
.dd-badge.orange { background: var(--ns-bg); color: var(--ns); }
.dd-badge.red { background: var(--od-bg); color: var(--od); }
.panel-card { padding: 18px 16px; max-height: calc(100vh - 86px); overflow: auto; position: sticky; top: 70px; }
.cal-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.cal-title { font-size: 24px; font-weight: 800; margin: 0 10px 0 6px; letter-spacing: -.5px; }
.cal-title small { font-size: 13px; color: var(--text-2); font-weight: 600; margin-left: 6px; }
.seg { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; margin-left: 6px; }
.seg button { border: 0; background: transparent; padding: 5px 20px; border-radius: 7px; cursor: pointer; font-weight: 700; color: var(--text-2); }
.seg button.on { background: var(--navy); color: #fff; }
.scope-label { font-size: 12.5px; color: var(--text-2); }

.sum-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; padding: 2px; }
@media (min-width: 1760px) { .sum-strip { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.sum { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 9px; padding: 11px 12px; border: 0; background: transparent; cursor: pointer; text-align: left; border-radius: 12px; min-width: 0; }
.sum:hover { background: #eef2f7; }
.sum.on { background: #fff; outline: 2px solid var(--teal); outline-offset: -2px; }
.sum-ic { display: grid; place-items: center; }
.sum-ic .ic { width: 26px; height: 26px; }
.sum-body { display: flex; flex-direction: column; min-width: 0; }
.sum-label { font-size: 13.5px; font-weight: 700; color: #2b3546; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sum-sub { font-size: 11.5px; color: var(--text-2); line-height: 1.3; }
.sum-num { font-size: 28px; font-weight: 800; line-height: 1; }
.c-plan { color: var(--plan); } .c-done { color: var(--done); } .c-od { color: var(--od); } .c-ns { color: var(--ns); } .c-doing { color: var(--doing); }

.cal { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-row + .cal-row { border-top: 1px solid var(--line); }
.cal-row.wd div { padding: 9px 6px; text-align: center; font-size: 14px; font-weight: 700; color: #2b3546; background: var(--surface-2); }
.cal-row.wd div + div { border-left: 1px solid var(--line); }
.cal-row.wd .sun { color: var(--od); }
.cal-row.this-week { background: #eef8f6; }
.cell { min-height: 112px; padding: 6px; border-left: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell:first-child { border-left: 0; }
.cell:hover { background: rgba(13, 118, 114, .04); }
.cell.other .num { color: #a7b0be; font-weight: 500; }
.cell.sel { background: #dff1ee; box-shadow: inset 0 0 0 2px var(--teal); }
.cell-head { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-height: 22px; font-size: 13px; }
.cell .num { font-weight: 600; color: #4a5568; display: inline-grid; place-items: center; min-width: 22px; height: 22px; }
.cell.sun .num { color: var(--od); }
.cell.today .num { background: var(--teal); color: #fff; border-radius: 50%; width: 30px; height: 30px; font-weight: 800; font-size: 14px; }
.wk { flex: none; width: auto; font-size: 11px; font-weight: 800; color: var(--teal-2); background: #c9ebe6; border-radius: 4px; padding: 0 5px; }
.hol { font-size: 10.5px; color: var(--od); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chg-tag { margin-left: auto; font-size: 10.5px; font-weight: 800; color: #fff; background: #2563c9; border-radius: 4px; padding: 0 5px; }

.ev { border-radius: 6px; padding: 4px 7px; font-size: 12.5px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
.ev-st { display: flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; }
.ev-st span { overflow: hidden; text-overflow: ellipsis; }
.ev-st .ic { width: 15px; height: 15px; }
.ev-t { font-weight: 600; color: #222b38; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.ev-who { font-size: 11px; color: var(--text-2); }
.ev.s-planned { background: var(--plan-bg); } .ev.s-planned .ev-st { color: var(--plan); }
.ev.s-done { background: var(--done-bg); } .ev.s-done .ev-st { color: var(--done); }
.ev.s-overdue { background: var(--od-bg); } .ev.s-overdue .ev-st { color: var(--od); }
.ev.s-doing { background: var(--doing-bg); } .ev.s-doing .ev-st { color: var(--doing); }
.ev.s-notstarted { background: var(--ns-bg); } .ev.s-notstarted .ev-st { color: var(--ns); }
.ev.change { background: #fff; border: 1.5px dashed #2563c9; }
.ev.log { background: var(--log-bg); color: var(--log); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; padding: 2px 6px; }
.ev:hover { filter: brightness(.97); }
.ev-more { font-size: 11.5px; color: var(--text-2); padding-left: 4px; font-weight: 600; }
.cal.week .cell { min-height: 260px; }
.cal.week .ev-t { white-space: normal; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { font-style: normal; font-weight: 600; }
.legend .ic { width: 17px; height: 17px; }
.legend span:nth-child(1) .ic { color: var(--plan); } .legend span:nth-child(2) .ic { color: var(--doing); }
.legend span:nth-child(3) .ic { color: var(--ns); } .legend span:nth-child(4) .ic { color: var(--done); }
.legend span:nth-child(5) .ic { color: var(--od); }
.lg-change { font-size: 11px; padding: 1px 6px; border: 1.5px dashed #2563c9; border-radius: 4px; color: #2563c9; }
.lg-log { font-size: 11px; padding: 1px 6px; background: var(--log-bg); border-radius: 4px; color: var(--log); }

/* ── 오른쪽 이번 주 확인사항 ── */
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
.pcard { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; background: #fff; }
.pcard-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-weight: 800; font-size: 15.5px; }
.pcard-head[data-act] { cursor: pointer; }
.pcard-ic { display: grid; place-items: center; }
.pcard-ic .ic { width: 22px; height: 22px; }
.pcard-title { flex: 1; }
.pcard-chev { color: var(--text-2); transition: transform .15s; }
.pcard-chev.open { transform: rotate(180deg); }
.pcard-body { padding: 4px 12px 10px; }
.pcard-foot { padding: 0 14px 14px; }
.pcard-foot p { margin: 4px 0 10px; color: var(--text-2); font-size: 13px; }
.pcard-foot .btn { width: 100%; padding: 10px; font-size: 15px; }
.tone-orange { border: 1.5px solid #f3c27a; }
.tone-orange .pcard-head { background: #fff6e8; color: #b35c00; }
.tone-orange .pcard-ic { color: #ef8a00; }
.tone-red { border: 1.5px solid #f0a8a3; }
.tone-red .pcard-head { background: #fdeeed; color: #b3251d; }
.tone-red .pcard-ic { color: var(--od); }
.tone-blue { border: 1.5px solid #b8cff5; }
.tone-blue .pcard-head { background: #eef4fe; color: #1d4fa8; }
.tone-blue .pcard-ic { color: #2563c9; }
.tone-gold .pcard-ic { color: var(--star); }
.tone-gray { background: var(--surface-2); }
.tone-gray .pcard-head { font-size: 14.5px; }
.tone-gray .pcard-ic { color: #5a6577; }
.tone-plain .pcard-ic { color: var(--teal); }
.panel-note { display: flex; gap: 6px; align-items: flex-start; color: var(--text-2); font-size: 12px; margin: 10px 2px 0; }

.ri { display: flex; gap: 10px; align-items: flex-start; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.ri:last-child { border-bottom: 0; }
.ri-main { flex: 1; min-width: 0; cursor: pointer; }
.ri-title { font-weight: 700; overflow-wrap: anywhere; }
.ri-meta { font-size: 12px; color: var(--text-2); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 3px 5px; align-items: center; }
.ri-tools { display: flex; gap: 4px; align-items: center; opacity: 0; transition: opacity .12s; }
.ri:hover .ri-tools, .ri:focus-within .ri-tools { opacity: 1; }
@media (hover: none) { .ri-tools { opacity: 1; } }
.ri.s-overdue .ri-title { color: #8f1d17; }
.chk { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--done); cursor: pointer; flex: none; }
.tiny-ic { padding: 3px; } .tiny-ic .ic { width: 15px; height: 15px; }
.star { color: var(--star); margin-right: 3px; }
/* 업무 구분 꼬리표: 지시·연간·분기·월간·주간·수시 */
.kind { display: inline-block; font-size: 10.5px; font-weight: 800; line-height: 1; padding: 2px 4px; border-radius: 4px; margin-right: 4px; vertical-align: 1px; color: #fff; }
.k-order { background: #b7791f; } .k-annual { background: #7c3aed; } .k-quarterly { background: #4f46e5; }
.k-monthly { background: #2563c9; } .k-weekly { background: #0f9488; } .k-adhoc { background: #6b7480; }
.k-plan { background: #fff; color: #5a6577; box-shadow: inset 0 0 0 1px #9aa3ad; }
.ev[class*="kb-"], .ri[class*="kb-"] { border-left: 3px solid transparent; }
.ri[class*="kb-"] { padding-left: 8px; }
.kb-order { border-left-color: #b7791f !important; } .kb-annual { border-left-color: #7c3aed !important; } .kb-quarterly { border-left-color: #4f46e5 !important; }
.kb-monthly { border-left-color: #2563c9 !important; } .kb-weekly { border-left-color: #0f9488 !important; } .kb-adhoc { border-left-color: #9aa3ad !important; }
.kb-plan { border-left: 3px dashed #9aa3ad !important; }
.kind-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; margin: -4px 0 10px; font-size: 12.5px; }
.kind-legend > .muted { font-weight: 700; margin-right: 6px; }
.kind-legend .kind { font-size: 11.5px; padding: 3px 6px; }
.kind-legend .kind-desc { color: var(--text-2); }
.kind-legend .kind-item { white-space: nowrap; margin-right: 12px; }
.kind { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.week-pick { display: inline-flex; align-items: center; gap: 8px; margin-left: 12px; }
.week-pick b { font-size: 15px; min-width: 190px; text-align: center; }
.week-pick input[type=date] { padding: 5px 8px; }
select.mini { padding: 2px 4px; font-size: 12px; border-radius: 6px; }
select.mini.wide { max-width: 220px; }
.dd { font-weight: 700; color: var(--text); }
.dd.late { color: var(--od); }
.req-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.req-row:last-child { border-bottom: 0; }
.req-row .ri-meta { grid-column: 1; }
.req-row .btn { grid-row: 1 / span 2; grid-column: 2; }

/* 기한 변경 반영 대기 */
.chg { padding: 8px 2px 10px; }
.chg + .chg { border-top: 1px dashed #f3c27a; }
.chg-title { font-size: 17px; font-weight: 800; cursor: pointer; }
.chg-title small { font-size: 12px; color: var(--text-2); font-weight: 600; margin-left: 4px; }
.chg-dates { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.chg-dates s { color: #8a93a3; font-size: 19px; font-weight: 700; }
.chg-dates b { color: var(--teal); font-size: 22px; font-weight: 800; }
.chg-dates .ic { color: #8a93a3; }
.src-tag { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); font-weight: 600; }
.chg-ev { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #3a4556; display: flex; flex-direction: column; gap: 4px; }
.chg-actions { display: flex; gap: 8px; margin-top: 12px; }
.chg-actions .btn { padding: 10px 14px; font-size: 15px; }
.chg-actions .btn.outline .ic { color: #5a6577; }
.chg-sec { background: #fffaf1; margin: 0 -18px; padding: 10px 18px !important; border-bottom: 1px solid #f3c27a !important; }

.chip { display: inline-block; padding: 0 6px; border-radius: 5px; font-size: 11.5px; font-weight: 700; line-height: 18px; white-space: nowrap; }
.chip.st-done { background: var(--done-bg); color: var(--done); }
.chip.st-doing { background: var(--doing-bg); color: var(--doing); }
.chip.st-notstarted { background: var(--ns-bg); color: var(--ns); }
.chip.st-planned { background: var(--plan-bg); color: var(--plan); }
.chip.warn { background: var(--od-bg); color: var(--od); border: 1px solid #f1b7b2; }
.chip.gray { background: var(--log-bg); color: var(--text-2); }
.tag { display: inline-block; padding: 0 6px; border-radius: 5px; font-size: 11.5px; line-height: 18px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.tag.type-order { color: var(--star); border-color: #ecd9a6; background: #fffaeb; }
.tag.type-cycle { color: var(--teal-2); border-color: #bfe3df; background: var(--teal-soft); }
.badge { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; line-height: 17px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.badge.red { background: var(--od-bg); color: var(--od); border-color: #f1b7b2; }
.badge.orange { background: var(--ns-bg); color: var(--ns); border-color: #f3d2a5; }
.badge.blue { background: var(--plan-bg); color: var(--plan); border-color: #c5d8f6; }
.badge.gray { background: var(--log-bg); }
.badge.green { background: var(--done-bg); color: var(--done); border-color: #b9e2c9; }

/* 상세 패널 */
.drawer-back { position: fixed; inset: 0; background: rgba(15, 22, 35, .3); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(540px, 100vw); background: var(--surface); z-index: 41; overflow: auto; padding: 18px 18px 24px; box-shadow: -8px 0 24px rgba(15, 22, 35, .15); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; }
.drawer-title { font-size: 21px; margin: 8px 0 10px; overflow-wrap: anywhere; font-weight: 800; }
.drawer-status { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.drawer-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.sec { padding: 10px 0; border-bottom: 1px solid var(--line); }
.sec:last-of-type { border-bottom: 0; }
.kvs { margin: 0; display: grid; gap: 4px; }
.kv { display: grid; grid-template-columns: 86px 1fr; gap: 8px; margin: 0; }
.kv dt { color: var(--text-2); font-size: 12.5px; }
.kv dd { margin: 0; }
.src { margin-bottom: 8px; }
.src-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
blockquote { margin: 4px 0 0; padding: 6px 10px; background: var(--surface-2); border-left: 3px solid var(--line-2); border-radius: 4px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note { font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.inline-form { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.inline-form input { flex: 1; min-width: 160px; }
.req-card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
.req-card.pending { border-color: #c5d8f6; background: #f7f9ff; }
.req-q { margin: 4px 0; font-weight: 600; }
.req-a { margin: 4px 0; padding-left: 8px; }
.answer-form { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.row-inline { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-inline label { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }

/* 모달 */
.modal-back { position: fixed; inset: 0; background: rgba(15, 22, 35, .38); z-index: 50; }
.modal { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border-radius: 14px; padding: 18px 20px; box-shadow: 0 12px 40px rgba(15, 22, 35, .25); }
.modal.wide { width: min(720px, calc(100vw - 24px)); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.form { display: flex; flex-direction: column; gap: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.form label > input, .form label > select, .form label > textarea { color: var(--text); font-weight: 400; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > label { flex: 1; min-width: 140px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.alert { padding: 8px 12px; border-radius: 8px; margin: 6px 0; font-size: 13px; }
.alert.error { background: var(--od-bg); color: #8a1f19; border: 1px solid #f1b7b2; }
.alert.warn { background: #fff6e5; color: #7a4a00; border: 1px solid #f3d7a5; }
.cands { display: flex; flex-direction: column; gap: 4px; }
.cand { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px; }
.cand.on { border-color: var(--teal); background: var(--teal-soft); }
.cand.warn { border-color: #f3d7a5; background: #fffbf2; }
.warn-text { width: 100%; color: #8a5200; font-size: 12px; }

/* 표 */
.table-wrap { overflow: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 12px; color: var(--text-2); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line-2); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.hl td { background: #f1f8f7; }
.tbl.compact td, .tbl.compact th { padding: 4px 6px; }
.filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; background: var(--surface); padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); }
.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--text-2); gap: 3px; }
.tabs-inline { display: flex; gap: 4px; }
.tab-btn { border: 1px solid var(--line-2); background: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; color: var(--text-2); }
.tab-btn.on { background: var(--navy); border-color: var(--navy); color: #fff; }

/* 문서 관리 */
.drop { display: flex; flex-direction: column; gap: 6px; padding: 18px; border: 2px dashed var(--line-2); border-radius: 10px; background: var(--surface-2); cursor: pointer; margin-bottom: 10px; }
.file-info { margin: 8px 0; }
.review-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.review-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 14px; align-items: start; }
.review-grid > .table-wrap { max-height: calc(100vh - 250px); }
.review-grid .side-pane, .review-grid > .box.pad { max-height: calc(100vh - 250px); overflow: auto; position: sticky; top: 70px; }
.tbl.review td { padding: 4px 5px; }
.tbl.review input, .tbl.review select { font-size: 12.5px; padding: 3px 5px; width: 100%; }
.tbl.review input[type=date] { min-width: 128px; }
.tbl.review td:nth-child(3) input { min-width: 180px; }
.tbl.review tr { cursor: pointer; }
.tbl.review tr.sel td { background: var(--teal-soft); }
.tbl.review tr.excluded td { opacity: .45; }
.raw-line { font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.raw-table { margin: 8px 0; }

/* 주간 보고서 */
.report-bar { display: flex; gap: 10px; align-items: center; }
.sheet { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 28px 34px; max-width: 900px; margin: 0 auto; width: 100%; }
.sheet h1 { font-size: 22px; text-align: center; }
.sheet-sub { text-align: center; color: var(--text-2); margin: 4px 0 12px; }
.sheet-sum { padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
.sheet h3 { margin: 16px 0 6px; font-size: 15px; border-bottom: 2px solid var(--text); padding-bottom: 3px; }
.sheet-foot { margin-top: 18px; font-size: 11.5px; color: var(--text-2); }
.print-tbl th { position: static; }

/* 알림 */
#toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(560px, calc(100vw - 24px)); }
.toast { background: #1c2330; color: #fff; padding: 10px 16px; border-radius: 9px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.toast.ok { background: #116b52; }
.toast.error { background: #a3241d; }
.toast.warn { background: #8a5a00; }

/* 좁은 화면: 숫자 → 달력 → 확인사항 순서로 쌓기 */
@media (max-width: 1500px) {
  .dash-grid { grid-template-columns: minmax(0, 1fr) 370px; }
}
@media (max-width: 1360px) {
  .dash-grid { grid-template-columns: 1fr; }
  .panel-card { position: static; max-height: none; }
}
@media (max-width: 1100px) {
  .dash-grid, .review-grid, .two-col { grid-template-columns: 1fr; }
  .day-cols { grid-template-columns: 1fr; }
  .day-col + .day-col { border-left: 0; border-top: 1px dashed var(--line); }
  .panel-card, .review-grid > .box.pad { position: static; max-height: none; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; padding: 12px; gap: 10px; }
  .side-brand { display: flex; align-items: baseline; gap: 10px; }
  .side-name { font-size: 22px; }
  .side-sub { margin: 0; }
  .side-nav { flex-direction: row; overflow-x: auto; padding-bottom: 0; border: 0; }
  .nav { padding: 8px 12px; font-size: 14px; white-space: nowrap; }
  .side-sec { display: none; }
  .topbar { position: static; padding: 8px 12px; }
}
@media (max-width: 700px) {
  .main { padding: 12px 12px 30px; }
  .hero h1 { font-size: 22px; }
  .top-right { margin-left: 0; width: 100%; flex-wrap: wrap; }
  .sum-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell { min-height: 72px; padding: 3px; }
  .ev { padding: 2px 3px; font-size: 10.5px; }
  .ev-st span { display: none; }
  .ev .kind { display: none; }
  .kind-legend .kind-desc { display: none; }
  .cal-title { font-size: 19px; }
  .cell.today .num { width: 24px; height: 24px; }
}

@media print {
  .side, .topbar, .hero, .foot-note, .no-print, #toasts, .drawer, .drawer-back, .modal, .modal-back { display: none !important; }
  .shell { display: block; }
  body, html { background: #fff; }
  .main { padding: 0; max-width: none; }
  .sheet { border: 0; padding: 0; max-width: none; }
  .tbl th { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4; margin: 14mm; }
}

const { realToday, setRefYear, fmtK, isISO, diffDays } = __req('js/dates.js');
const { nextDates, displayStatus, isOverdue, ddayLabel, DISPLAY_LABEL, DISPLAY_ICON, TYPE_LABEL, CYCLE_LABEL, STATUS_LABEL } = __req('js/rules.js');
const { buildSeed } = __req('js/seed.js');
const { buildHwpx } = __req('js/hwpxWrite.js');


const LS_ME = 'tracker.me';
const LS_DEMO = 'tracker.demoDate';
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) {
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch { /* 저장 불가 환경이면 무시 */ }
}

const state = {
  db: Object.fromEntries(TABLES.map((t) => [t, []])),
  me: lsGet(LS_ME) || 'all',
  tab: 'home', // 첫 화면은 이번 주. 전체 달력은 'dashboard'
  calMonth: null,
  panel: null, // {kind:'card', key} | {kind:'date', date}
  detailId: null,
  modal: null,
  loading: true,
  loadError: null,
  imp: null,
  mgmt: { view: 'open', type: '', assignee: '', status: '', from: '', to: '' },
  deptWeek: null,
  reportWeek: null, // 주간 보고서에서 고른 주 (월요일). null이면 기준일이 속한 주
  orders: { view: 'open', assignee: '' }, // 지시사항 추적 화면 보기 조건

  collapsed: { undated: true, others: true },
};

const handlers = {};
let renderFn = () => {};
function setRender(fn) { renderFn = fn; }
function render() { renderFn(); }

// ── 기준일 (§7.12 시연 기준일은 브라우저에만 저장) ──
function demoDate() { const v = lsGet(LS_DEMO); return isISO(v) ? v : null; }
function setDemoDate(v) { lsSet(LS_DEMO, v || null); setRefYear(today().slice(0, 4)); }
function today() { return demoDate() || realToday(); }
setRefYear(today().slice(0, 4));

function setMe(id) { state.me = id || 'all'; lsSet(LS_ME, state.me); }
const meId = () => (state.me === 'all' ? null : state.me);

// ── 알림 (화면 전체를 다시 그리지 않도록 별도 영역에 그린다) ──
let toasts = [];
function drawToasts() {
  const box = document.getElementById('toasts');
  if (box) box.innerHTML = toasts.map((t) => `<div class="toast ${t.kind}">${esc(t.msg)}</div>`).join('');
}
function toast(msg, kind = 'info', ms = 3800) {
  const id = Math.random();
  toasts.push({ id, msg, kind });
  drawToasts();
  setTimeout(() => { toasts = toasts.filter((t) => t.id !== id); drawToasts(); }, ms);
}

// 저장 작업 감싸기: 실패하면 안내하고 저장소에서 다시 읽어 화면과 저장소를 맞춘다.
function act(fn) {
  return async (...args) => {
    try {
      await fn(...args);
    } catch (e) {
      console.error(e);
      toast(`저장 실패: ${e.message}`, 'error', 7000);
      try { await reloadAll(); } catch { /* 이미 안내함 */ }
    }
    render();
  };
}

// ── 불러오기 ──
async function reloadAll() {
  const res = await Promise.all(TABLES.map((t) => store.list(t)));
  TABLES.forEach((t, i) => { state.db[t] = res[i]; });
}

    if (!state.db.members.length) await resetSample();
    state.loadError = null;
  } catch (e) {
    console.error(e);
    state.loadError = e.message;
  }
  state.loading = false;
}

      log.push({ file: f, r, items });
    }
    for (const req of seed.requests(state.db.tasks)) await saveRec('check_requests', req);
  } catch (e) {
    defer = null;
    await reloadAll();
    throw e;
  }
  files = defer.files;
  defer = null;
  if (dryRun) return { db: state.db, files, log };
  for (const t of TABLES) {
    await store.clear(t);
    await store.saveMany(t, state.db[t]);
  }
  try {
    await store.clear(FILE_TABLE);
    for (const f of files) await store.save(FILE_TABLE, f);
  } catch (e) { console.warn('원본 파일을 보관하지 못했습니다', e); }
  await reloadAll();
  return { log };
}

// ── 백업·옮기기 (로컬판: 저장소가 이 PC 브라우저뿐이라 파일로 내보내고 가져온다) ──
async function exportBackup() {
  const tables = {};
  for (const t of TABLES) tables[t] = await store.list(t);
  const files = await store.list(FILE_TABLE).catch(() => []);
  const data = { app: 'kookbang-eum-plus', version: 1, exportedAt: new Date().toISOString(), tables, files };
  const name = `국방이음plus_백업_${today()}.json`;
  saveBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), name);
  return { name, counts: Object.fromEntries(TABLES.map((t) => [t, tables[t].length])), files: files.length };
}
// 백업 파일로 이 PC의 데이터를 통째로 바꾼다
async function importBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('백업 파일(JSON)을 읽지 못했습니다.'); }
  if (data?.app !== 'kookbang-eum-plus' || !data.tables) throw new Error('국방이음+ 백업 파일이 아닙니다.');
  for (const t of TABLES) { await store.clear(t); await store.saveMany(t, data.tables[t] || []); }
  await store.clear(FILE_TABLE);
  let skipped = 0;
  for (const f of data.files || []) { try { await store.save(FILE_TABLE, f); } catch { skipped++; } }
  await reloadAll();
  return { tasks: state.db.tasks.length, docs: state.db.documents.length, skipped };
}
// 실제 업무용 시작: 구성원만 남기고 업무·문서·실시사항·요청·원본을 모두 지운다
async function startEmpty() {
  const members = state.db.members.length ? state.db.members : buildSeed(today()).members.map(stamp);
  for (const t of TABLES) { await store.clear(t); if (t === 'members') await store.saveMany(t, members); }
  await store.clear(FILE_TABLE);
  await reloadAll();
}

// ── 반영 자료 원본 보관·내려받기 ──
const MAX_FILE = 5 * 1024 * 1024;
function toB64(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
// 원본 저장은 실패해도 가져오기를 막지 않는다. 성공 여부를 돌려준다.
async function saveDocFile(doc, buf) {
  if (!buf || buf.byteLength > MAX_FILE) return false;
  const rec = { id: doc.id, fileName: doc.fileName, size: buf.byteLength, b64: toB64(buf) };
  if (defer) { defer.files.push(rec); return true; }
  try {
    await store.save(FILE_TABLE, rec);
    return true;
  } catch (e) {
    console.warn('원본 파일 저장 실패', e);
    return false;
  }
}
function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// 원본이 있으면 HWPX 원본을, 없으면(초기 샘플 등) 이 문서에서 반영된 내용을 정리한 HWPX를 만들어 내려받는다.
async function downloadDoc(id) {
  const d = docOf(id);
  if (!d) return;
  if (d.hasFile) {
    const f = await store.get(FILE_TABLE, id);
    if (f?.b64) {
      const bin = atob(f.b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      saveBlob(new Blob([bytes], { type: 'application/hwp+zip' }), d.fileName);
      return 'file';
    }
  }
  const name = d.fileName.replace(/\.hwpx$/i, '');
  saveBlob(buildHwpx(name, docSummaryBlocks(d)), `${name} (반영 내용).hwpx`);
  return 'summary';
}
function docSummaryBlocks(d) {
  const B = [];
  const fk = (v) => fmtK(v) || '-';
  B.push({ p: `${d.fileName.replace(/\.hwpx$/i, '')} - 반영 내용`, style: 'title' });
  B.push({ p: `작성일 ${fk(d.writtenDate)} / 대상 기간 ${fk(d.periodFrom)} ~ ${fk(d.periodTo)} / 등록 ${d.importedAt ? fk(d.importedAt.slice(0, 10)) : '초기 샘플'}` });
  B.push({ p: '※ 교육·시연용 가상 데이터. 원본 파일이 보관되지 않은 자료라 이 도구에 반영된 내용을 정리했습니다.' });
  const ev = state.db.task_evidence.filter((e) => e.documentId === d.id);
  if (ev.length) {
    B.push({ p: '' }, { p: `□ 연결된 업무 (${ev.length}건)`, style: 'head' });
    B.push({ table: [['업무', '담당', '상태', '마감', '원문'], ...ev.map((e) => { const t = findTask(e.taskId); return [t ? t.title : '(삭제된 업무)', t ? memberName(t.assigneeId) || '미정' : '', t ? STATUS_LABEL[t.status] || t.status : '', t?.dueDate ? fmtK(t.dueDate) : '-', e.text || '']; })] });
  }
  const logs = state.db.daily_logs.filter((l) => l.documentId === d.id);
  if (logs.length) {
    B.push({ p: '' }, { p: `□ 실시사항 (${logs.length}건)`, style: 'head' });
    B.push({ table: [['일자', '담당', '내용', '결과', '연결된 업무'], ...logs.map((l) => [fmtK(l.date), memberName(l.assigneeId) || '', l.content, l.result || '-', (l.taskId && findTask(l.taskId)?.title) || '-'])] });
  }
  const plans = state.db.weekly_plans.filter((p) => p.documentId === d.id);
  if (plans.length) {
    B.push({ p: '' }, { p: `□ 주간 예정사항 (${plans.length}건)`, style: 'head' });
    B.push({ table: [['일자', '담당', '내용'], ...plans.map((p) => [fmtK(p.plannedDate), memberName(p.assigneeId) || '', p.content])] });
  }
  if (d.extractedText) {
    B.push({ p: '' }, { p: '□ 원문 텍스트', style: 'head' });
    d.extractedText.split('\n').forEach((line) => B.push({ p: line }));
  }
  return B;
}

// ── 조회 도우미 ──
const findTask = (id) => state.db.tasks.find((t) => t.id === id);
const member = (id) => state.db.members.find((m) => m.id === id);
const memberName = (id) => member(id)?.name || '';
const memberFull = (id) => { const m = member(id); return m ? [m.name, m.rank].filter(Boolean).join(' ') : ''; };
const docOf = (id) => state.db.documents.find((d) => d.id === id);
const evidenceOf = (taskId) => state.db.task_evidence.filter((e) => e.taskId === taskId);
const logsOf = (taskId) => state.db.daily_logs.filter((l) => l.taskId === taskId);
// 지시사항 추적: 마지막 조치 = 메모(진행 내용·조치사항)와 연결된 실시사항 중 가장 늦은 것
function lastAction(t) {
  const list = [
    ...(t.notes || []).map((n) => ({ date: n.date, text: n.text, by: n.authorId })),
    ...logsOf(t.id).map((l) => ({ date: l.date, text: l.content, by: l.assigneeId })),
  ].filter((x) => x.date).sort((a, b) => a.date.localeCompare(b.date));
  return list[list.length - 1] || null;
}
// 미결 지시사항이 조치 없이 지난 날수 (마지막 조치가 없으면 지시일부터). 이 값 이상이면 "조치 없음"으로 표시한다.
const STALE_DAYS = 7;
function staleDays(t, T) {
  if (t.status === 'done') return null;
  const base = lastAction(t)?.date || t.orderDate || (t.createdAt || '').slice(0, 10);
  return isISO(base) ? diffDays(T, base) : null;
}
const requestsOf = (taskId) => state.db.check_requests.filter((r) => r.taskId === taskId)
  .sort((a, b) => (b.requestedAt || '').localeCompare(a.requestedAt || ''));
const scopeTasks = () => (state.me === 'all' ? state.db.tasks : state.db.tasks.filter((t) => t.assigneeId === state.me));
const pendingRequestsFor = (me) => state.db.check_requests
  .filter((r) => r.state === 'pending' && (me === 'all' || r.targetId === me));
const sortedMembers = () => [...state.db.members].sort((a, b) => (a.order ?? 99) - (b.order ?? 99));

// §7.4 실시사항 문서의 대상 기간 밖에 있는 업무
function outOfLogPeriod(t) {
  if (!t.dueDate) return false;
  const docs = state.db.documents.filter((d) => d.docType === 'logs' && d.periodFrom && d.periodTo);
  return !docs.some((d) => t.dueDate >= d.periodFrom && t.dueDate <= d.periodTo);
}

// ── 저장 ──
async function saveRec(table, rec) {
  const saved = defer ? stamp(rec) : await store.save(table, rec);
  const list = state.db[table];
  const i = list.findIndex((x) => x.id === saved.id);
  if (i >= 0) list[i] = saved; else list.push(saved);
  return saved;
}
async function removeRec(table, id) {
  if (!defer) await store.remove(table, id);
  state.db[table] = state.db[table].filter((x) => x.id !== id);
}

function newTask(fields) {
  return {
    title: '', type: 'adhoc', cycle: null, startDate: null, dueDate: null, orderDate: null, orderedBy: null,
    assigneeId: null, status: 'todo', notes: [], completedAt: null, completedMethod: null, completedBy: null,
    prevStatus: null, prevTaskId: null, autoGenerated: false, ...fields,
  };
}

// 완료 처리. 주기 업무면 다음 회차를 만든다 (§7.3).
async function completeTask(t, { date = today(), method = 'manual' } = {}) {
  const prevStatus = t.status === 'done' ? (t.prevStatus || 'todo') : t.status;
  const task = await saveRec('tasks', {
    ...t, status: 'done', completedAt: date, completedMethod: method, completedBy: meId(), prevStatus,
  });
  let next = null;
  if (t.type === 'cycle' && t.cycle && t.dueDate && !state.db.tasks.some((x) => x.prevTaskId === t.id)) {
    next = await saveRec('tasks', newTask({
      title: t.title, type: 'cycle', cycle: t.cycle, assigneeId: t.assigneeId,
      ...nextDates(t), prevTaskId: t.id, autoGenerated: true,
    }));
  }
  return { task, next };
}

// §7.9 완료 취소
async function uncompleteTask(t) {
  const task = await saveRec('tasks', {
    ...t, status: t.prevStatus && t.prevStatus !== 'done' ? t.prevStatus : 'todo',
    completedAt: null, completedMethod: null, completedBy: null,
  });
  // 완료 근거였던 실시사항만 연결을 푼다. 진행 기록은 그대로 둔다.
  for (const log of logsOf(t.id).filter(isDoneLog)) await saveRec('daily_logs', { ...log, taskId: null });
  const next = state.db.tasks.find((x) => x.prevTaskId === t.id);
  const out = { task };
  if (next) {
    const untouched = next.status === 'todo' && !(next.notes || []).length && !requestsOf(next.id).length;
    if (untouched) { await deleteTask(next); out.removedNext = next; } else out.keptNext = next;
  }
  return out;
}

async function setStatus(t, status) {
  if (status === t.status) return {};
  if (status === 'done') return completeTask(t);
  if (t.status === 'done') return uncompleteTask(t);
  return { task: await saveRec('tasks', { ...t, status }) };
}

// 직접 진행중으로 바꿀 때는 진행 내용(메모)을 반드시 남긴다.
async function startProgress(t, text) {
  if (!text) throw new Error('진행 내용을 입력하세요.');
  let res = { wasDoing: t.status === 'doing' };
  if (t.status === 'done') { res = await uncompleteTask(t); t = findTask(t.id); }
  const note = { date: today(), at: new Date().toISOString(), authorId: meId(), text, kind: 'progress' };
  const task = await saveRec('tasks', { ...t, status: 'doing', startedMethod: t.startedMethod || 'note', notes: [...(t.notes || []), note] });
  return { ...res, task };
}

async function deleteTask(t) {
  for (const e of evidenceOf(t.id)) await removeRec('task_evidence', e.id);
  for (const l of logsOf(t.id)) await saveRec('daily_logs', { ...l, taskId: null });
  for (const r of requestsOf(t.id)) await removeRec('check_requests', r.id);
  for (const n of state.db.tasks.filter((x) => x.prevTaskId === t.id)) await saveRec('tasks', { ...n, prevTaskId: null });
  await removeRec('tasks', t.id);
}

async function addNote(t, text) {
  const notes = [...(t.notes || []), { date: today(), at: new Date().toISOString(), authorId: meId(), text }];
  return saveRec('tasks', { ...t, notes });
}

// §7.8 실시사항 ↔ 업무 연결. 결과가 "완료"인 기록은 그 업무를 실시 일자로 완료 처리하고,
// "진행" 기록은 미착수 업무를 진행중으로 바꾼다 (완료로 만들지 않는다).
const isDoneLog = (log) => log.result === '완료';
async function linkLog(log, taskId) {
  if (log.taskId && log.taskId !== taskId) log = (await unlinkLog(log)).log;
  const saved = await saveRec('daily_logs', { ...log, taskId });
  const t = findTask(taskId);
  let res = {};
  if (t && isDoneLog(saved) && t.status !== 'done') res = await completeTask(t, { date: log.date, method: 'log' });
  else if (t && !isDoneLog(saved) && t.status === 'todo') res = { task: await saveRec('tasks', { ...t, status: 'doing', startedMethod: 'log' }), started: true };
  if (t && log.documentId && !evidenceOf(t.id).some((e) => e.documentId === log.documentId && e.relation === 'log')) {
    await saveRec('task_evidence', { taskId: t.id, documentId: log.documentId, location: log.location || '', text: log.raw || log.content, relation: 'log' });
  }
  return { log: saved, ...res };
}
async function unlinkLog(log) {
  const t = findTask(log.taskId);
  const saved = await saveRec('daily_logs', { ...log, taskId: null });
  let res = {};
  const left = t ? logsOf(t.id) : [];
  if (t && t.status === 'done' && t.completedMethod === 'log' && !left.some(isDoneLog)) res = await uncompleteTask(t);
  else if (t && t.status === 'doing' && t.startedMethod === 'log' && !left.length) res = { task: await saveRec('tasks', { ...t, status: 'todo', startedMethod: null }), stopped: true };
  return { log: saved, ...res };
}
async function deleteLog(log) {
  if (log.taskId) await unlinkLog(log);
  await removeRec('daily_logs', log.id);
}

// 기한 변경 반영 대기: 문서마다 마감일이 다르면 바로 바꾸지 않고 변경안으로 남겨 사람이 반영한다.
async function proposeChange(t, { dueDate, documentId, location, text }) {
  const cur = t.pendingChange && t.pendingChange.dueDate === dueDate ? t.pendingChange : { dueDate, fromDue: t.dueDate, sources: [], proposedAt: new Date().toISOString() };
  const sources = [...cur.sources.filter((s) => s.documentId !== documentId), { documentId, location, text }];
  return saveRec('tasks', { ...t, pendingChange: { ...cur, sources } });
}
async function applyChange(t) {
  const pc = t.pendingChange;
  if (!pc) return t;
  const shift = t.startDate && t.dueDate ? Math.round((Date.parse(pc.dueDate) - Date.parse(t.dueDate)) / 86400000) : 0;
  const startDate = t.startDate && shift ? new Date(Date.parse(t.startDate) + shift * 86400000).toISOString().slice(0, 10) : t.startDate;
  const note = { date: today(), at: new Date().toISOString(), authorId: meId(), text: `기한 변경 반영: ${fmtK(pc.fromDue) || '없음'} → ${fmtK(pc.dueDate)}` };
  return saveRec('tasks', { ...t, dueDate: pc.dueDate, startDate: startDate && startDate > pc.dueDate ? pc.dueDate : startDate, pendingChange: null, notes: [...(t.notes || []), note] });
}
async function holdChange(t) {
  const pc = t.pendingChange;
  if (!pc) return t;
  const note = { date: today(), at: new Date().toISOString(), authorId: meId(), text: `기한 변경안 보류: ${fmtK(pc.dueDate)} (현재 마감 ${fmtK(t.dueDate)} 유지)` };
  return saveRec('tasks', { ...t, pendingChange: null, notes: [...(t.notes || []), note] });
}
const pendingChanges = (tasks) => tasks.filter((t) => t.pendingChange && t.status !== 'done');

// §7.11 진행 확인 요청·답변
async function sendRequest(t, content) {
  return saveRec('check_requests', {
    taskId: t.id, requesterId: state.me, targetId: t.assigneeId, content,
    requestedAt: new Date().toISOString(), answer: null, answeredAt: null, answeredBy: null, state: 'pending',
  });
}
// 답변만 남긴다. 업무 상태는 바꾸지 않는다 (진행중은 진행 내용·진행 기록으로만).
async function answerRequest(req, answer) {

}
async function closeRequest(req) {

}

// 결과 알림 문구 (다음 회차 생성·삭제 안내)
function describeResult(res) {
  const out = [];
  if (res?.started) out.push('업무를 진행중으로 바꿨습니다.');
  if (res?.stopped) out.push('진행 기록이 없어져 업무를 미착수로 되돌렸습니다.');
  if (res?.next) out.push(`다음 회차(${fmtK(res.next.dueDate)} 마감)를 자동 생성했습니다.`);
  if (res?.removedNext) out.push('자동 생성했던 다음 회차를 함께 지웠습니다.');
  if (res?.keptNext) out.push('다음 회차는 이미 손댄 상태라 남겨 두었습니다. 필요하면 직접 지우세요.');
  return out.join(' ');
}

// ── 화면 도우미 ──
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function options(map, sel, { empty } = {}) {
  const head = empty != null ? `<option value="">${esc(empty)}</option>` : '';
  return head + Object.entries(map).map(([v, l]) => `<option value="${esc(v)}" ${v === (sel ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
}
function memberOptions(sel, empty = '— 담당자 미정 —') {
  const ms = sortedMembers();
  const grp = (role, label) => {
    const list = ms.filter((m) => m.role === role);
    return list.length ? `<optgroup label="${label}">${list.map((m) => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${esc(memberFull(m.id))}</option>`).join('')}</optgroup>` : '';
  };
  return (empty != null ? `<option value="">${esc(empty)}</option>` : '') + grp('reviewer', '전체 검토자') + grp('member', '담당 부서');
}
function statusChip(t, T) {
  const ds = displayStatus(t, T);
  let h = `<span class="chip st-${ds}">${DISPLAY_ICON[ds]} ${DISPLAY_LABEL[ds]}</span>`;
  if (isOverdue(t, T)) h += ` <span class="chip warn">⚠ 완료 미확인</span>`;
  return h;
}
// 업무 구분 꼬리표 (달력 칩·주간 보고서). 주기 업무는 주기별로, 지시사항·수시 업무는 따로 표시한다.
const KINDS = [['order', '지시'], ['annual', '연간'], ['quarterly', '분기'], ['monthly', '월간'], ['weekly', '주간'], ['adhoc', '수시']];
const KIND_LABEL = Object.fromEntries(KINDS);
const kindOf = (t) => (t.type === 'order' ? 'order' : t.type === 'cycle' ? (t.cycle || 'monthly') : 'adhoc');
const kindTag = (t) => `<span class="kind k-${kindOf(t)}">${KIND_LABEL[kindOf(t)]}</span>`;

function typeTag(t) {
  if (t.type === 'cycle') return `<span class="tag type-cycle">${CYCLE_LABEL[t.cycle] || ''} 주기</span>`;
  if (t.type === 'order') return `<span class="tag type-order">★ 지시사항</span>`;

  return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function localAdapter() {
  const KEY = 'tracker.db.v3'; // v3: 구성원을 지휘관·과·중대 단위로 변경
  const load = () => {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  };
  const persist = (db) => {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { throw new Error('브라우저 저장 공간에 쓸 수 없습니다 (' + e.message + ')'); }
  };
  // 원본 파일은 크기가 커서 업무 데이터와 한 덩어리로 두지 않고 파일마다 따로 저장한다
  // (가득 차도 업무 저장은 계속되도록).
  const FK = 'tracker.file.';
  const fileKeys = () => Object.keys(localStorage).filter((k) => k.startsWith(FK));
  const files = {
    async list() { return fileKeys().map((k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }).filter(Boolean); },
    async get(id) { try { return JSON.parse(localStorage.getItem(FK + id)); } catch { return null; } },
    async save(rec) {
      try { localStorage.setItem(FK + rec.id, JSON.stringify(rec)); } catch (e) { throw new Error('브라우저 저장 공간이 부족해 원본 파일을 보관하지 못했습니다 (' + e.message + ')'); }
      return rec;
    },
    async remove(id) { localStorage.removeItem(FK + id); },
    async clear() { fileKeys().forEach((k) => localStorage.removeItem(k)); },
  };
  return {
    mode: 'local',
    async list(t) { return t === FILE_TABLE ? files.list() : Object.values(load()[t] || {}); },
    async get(t, id) { return t === FILE_TABLE ? files.get(id) : (load()[t] || {})[id] || null; },
    async save(t, rec) { if (t === FILE_TABLE) return files.save(rec); const db = load(); (db[t] ||= {})[rec.id] = rec; persist(db); return rec; },
    async saveMany(t, recs) { if (t === FILE_TABLE) { for (const r of recs) await files.save(r); return; } const db = load(); db[t] ||= {}; recs.forEach((r) => { db[t][r.id] = r; }); persist(db); },
    async remove(t, id) { if (t === FILE_TABLE) return files.remove(id); const db = load(); if (db[t]) delete db[t][id]; persist(db); },
    async clear(t) { if (t === FILE_TABLE) return files.clear(); const db = load(); db[t] = {}; persist(db); },
  };
}

// Supabase REST(PostgREST)를 fetch로 직접 호출한다. 각 테이블은 (id text, data jsonb) 구조. supabase/schema.sql 참고.
function supabaseAdapter(url, key) {
  const base = url.replace(/\/+$/, '') + '/rest/v1/';
  const headers = { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' };
  async function req(path, opts = {}) {
    let res;
    try {
      res = await fetch(base + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
    } catch (e) {
      throw new Error('공유 저장소에 연결할 수 없습니다 (네트워크 확인)');
    }
    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(`공유 저장소 오류 ${res.status} ${txt.slice(0, 160)}`);
    }
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  }
  const row = (r) => ({ id: r.id, data: r, updated_at: new Date().toISOString() });
  const upsert = (t, rows) => req(`${t}?on_conflict=id`, {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(rows),
  });
  return {
    mode: 'supabase',
    async list(t) {
      const out = [];
      const page = 1000;
      for (let from = 0; ; from += page) {
        const rows = await req(`${t}?select=id,data&order=id&limit=${page}&offset=${from}`);
        out.push(...rows.map((r) => ({ ...r.data, id: r.id })));
        if (rows.length < page) break;
      }
      return out;
    },
    async get(t, id) {
      const rows = await req(`${t}?select=id,data&id=eq.${encodeURIComponent(id)}`);
      return rows[0] ? { ...rows[0].data, id: rows[0].id } : null;
    },
    async save(t, rec) { await upsert(t, [row(rec)]); return rec; },
    async saveMany(t, recs) {
      for (let i = 0; i < recs.length; i += 500) await upsert(t, recs.slice(i, i + 500).map(row));
    },
    async remove(t, id) { await req(`${t}?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' }); },
    async clear(t) { await req(`${t}?id=not.is.null`, { method: 'DELETE' }); },
  };
}

const adapter = CONFIG.supabaseUrl && CONFIG.supabaseAnonKey
  ? supabaseAdapter(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey)
  : localAdapter();

function stamp(rec) {
  const now = new Date().toISOString();
  return { ...rec, id: rec.id || uid(), createdAt: rec.createdAt || now, updatedAt: now };
}

const store = {
  mode: adapter.mode,
  async list(table, filter) {
    const rows = await adapter.list(table);
    if (!filter) return rows;
    return rows.filter((r) => Object.entries(filter).every(([k, v]) => r[k] === v));
  },
  get: (table, id) => adapter.get(table, id),
  save: (table, data) => adapter.save(table, stamp(data)),
  saveMany: (table, list) => adapter.saveMany(table, list.map(stamp)),
  remove: (table, id) => adapter.remove(table, id),
  clear: (table) => adapter.clear(table),
};

return { TABLES, FILE_TABLE, uid, stamp, store };

// 화면 ① 업무 달력: 요약 띠 + 달력(월/주) + 이번 주 확인사항 (PRD §5 기능 2)

// 업무 구분 범례 (달력 위)
// plan: 이번 주 화면에는 업무로 등록되지 않은 주간 예정사항(예정)도 나온다

function renderDashboard() {
  const T = today();
  const tasks = scopeTasks();
  const s = summary(tasks, T);
  const changes = pendingChanges(tasks);

  <div class="dash-grid">

        <span>${STATUS_IC.notstarted}<i class="c-ns">미착수</i></span><span>${STATUS_IC.done}<i class="c-done">완료</i></span>

  const item = (key, ic, label, num, sub, cls) => `

    ${item('open', STATUS_IC.overdue, '미완료', s.open.length, `완료 미확인 ${s.openOverdue.length} · 미착수 ${s.openNotStarted.length}`, 'c-od')}
    ${item('next', IC.arrowR, '다음 주 반영', s.carry.length + s.fresh.length, `이월 ${s.carry.length} · 신규 ${s.fresh.length}`, 'c-doing')}

// ── 달력 칸 내용 ──
function calEvents(tasks) {

    const map = { week: ['이번 주 할 일', s.week], done: ['이번 주 완료', s.done], open: ['이번 주 미완료', s.open], next: ['다음 주 반영', [...s.carry, ...s.fresh]] };

// ── 이벤트 ──
Object.assign(handlers, {

      const hash = await sha256(buf);
      const blocks = await parseHwpx(buf);

        ...state.imp, buf, hash, blocks, meta: guessMeta(file.name, blocks, today()),
        dupDoc: state.db.documents.find((d) => d.hash && d.hash === hash) || null,
      };
    } catch (e) {
      state.imp.error = `파일을 읽지 못했습니다: ${e.message}`;
    }

  },

  impSel(el, e) {

    if (f === 'type' && it.type === 'order' && !it.orderDate) it.orderDate = state.imp.meta.writtenDate;
    if (f === 'action' && (it.action === 'new' || it.action === 'logonly' || it.action === 'planonly' || it.action === 'exclude')) { /* 연결 선택은 유지해 두되 실행 시 쓰지 않는다 */ }
    if (['title', 'content', 'dueDate', 'date', 'assigneeId'].includes(f)) {
      const keep = { action: it.action, linkTaskId: it.linkTaskId };
      if (it.kind === 'log' && f === 'content') it.result = logResult(it.content);
      suggest(it, ctx());
      Object.assign(it, keep);

  },
  impPick(el) {
    const it = state.imp.items[state.imp.sel];

  impPickSel(el) {

  }),

    const list = state.db.tasks.filter((t) => t.status === 'done' && (!g.type || t.type === g.type) && byAssignee(t)
      && (!g.from || (t.completedAt || '') >= g.from) && (!g.to || (t.completedAt || '') <= g.to))
      .sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
    body = `
      <div class="filters">${filters}
        <label>완료일<input type="date" data-chg="mgmtFilter" data-f="from" value="${esc(g.from)}"></label>
        <label>~<input type="date" data-chg="mgmtFilter" data-f="to" value="${esc(g.to)}"></label>
        <span class="grow"></span><span class="muted">${list.length}건</span>
      </div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>업무명</th><th>구분</th><th>담당자</th><th>마감일</th><th>완료일</th><th>완료 방법</th><th></th></tr></thead>
        <tbody>${list.map((t) => `
          <tr>
            <td><a href="#" data-act="openDetail" data-id="${t.id}">✓ ${esc(t.title)}</a></td>
            <td>${typeTag(t)}</td>
            <td>${esc(memberName(t.assigneeId))}</td>
            <td>${fmtK(t.dueDate)}</td>
            <td>${fmtK(t.completedAt)}</td>
            <td>${METHOD_LABEL[t.completedMethod] || ''}</td>
            <td><button class="btn small" data-act="historyUndo" data-id="${t.id}">완료 취소</button></td>
          </tr>`).join('') || '<tr><td colspan="7" class="empty">완료 이력이 없습니다.</td></tr>'}
        </tbody></table></div>`;
  }
  return `<div class="page"><div class="page-head"><div class="tabs-inline">${tab('open', '진행 중 업무')}${tab('history', '완료 이력')}</div></div>${body}</div>`;
}

Object.assign(handlers, {
  mgmtView(el) { state.mgmt.view = el.dataset.v; state.mgmt.status = ''; render(); },
  mgmtFilter(el) { state.mgmt[el.dataset.f] = el.value; render(); },
  historyUndo: act(async (el) => {
    const t = findTask(el.dataset.id);
    if (!t || !confirm(`'${t.title}' 완료를 취소할까요?\n상태가 완료 전(${STATUS_LABEL[t.prevStatus] || '미착수'})으로 돌아가고 완료일·완료 방법이 지워집니다.${t.completedMethod === 'log' ? '\n연결된 실시사항은 연결만 풀리고 기록은 남습니다.' : ''}`)) return;
    const res = await uncompleteTask(t);
    toast(['완료를 취소했습니다.', describeResult(res)].join(' '));
  }),
});

return { renderTasks };
});
__req('js/main.js');

})();
</script>
